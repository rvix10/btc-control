<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Control BTC</title>
    <meta name="description" content="Control de compras, retiros, ganancias y proyección de Bitcoin." />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Control BTC" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #0d0f14; }
      /* respeta el notch cuando corre como app instalada */
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      /* Shim de utilidades (equivalentes a las de Tailwind usadas en App.jsx) */
      .flex { display: flex; }
      .grid { display: grid; }
      .items-center { align-items: center; }
      .items-start { align-items: flex-start; }
      .items-baseline { align-items: baseline; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
